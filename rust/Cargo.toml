[package]
name = "rust_lib_audio2srt"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
whisper-rs = { version = "0.16.0" }
hound = "3.5.1"
anyhow = "1.0"
zhconv = "0.4.1"

[features]
default = ["vulkan"]
vulkan = ["whisper-rs/vulkan"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
