[package]
name = "rust_lib_audio2srt"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
whisper-rs = { version = "0.16.0", optional = true }
hound = "3.5.1"
anyhow = "1.0"
thiserror = "1.0"
zhconv = "0.4.1"
rubato = "0.15"
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", package = "deep_filter", default-features = false }
deepfilter-rt = { path = "third_party/deepfilter-rt" }
# Encoder: ONNX Runtime (DirectML / CUDA 可选后端)
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["download-binaries", "copy-dylibs", "tls-native", "ndarray"] }
# Decoder: llama.cpp via Vulkan / CUDA (GGUF / multimodal LLM)
llama-cpp-sys-2 = { version = "0.1.152", default-features = false, optional = true }
flate2 = "1.0"
tar = "0.4"
crossbeam-channel = "0.5"
core_affinity = "0.8"
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading", "Win32_System_LibraryLoader"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
sha2 = "0.10"
once_cell = "1.19"
parking_lot = "0.12"
realfft = "1"


[features]
# 1. vulkan 特性:
#    - Windows 平台: GGUF(Vulkan) + ort(DirectML)
#    - 非 Windows 平台: GGUF(Vulkan) + ort(CPU)
# 2. cuda 特性:
#    - 全平台: GGUF(CUDA) + ort(CUDA)
default = ["cuda"]
vulkan = ["dep:llama-cpp-sys-2", "llama-cpp-sys-2/vulkan", "qwen-dml-win", "legacy-whisper"]
cuda   = ["dep:llama-cpp-sys-2", "llama-cpp-sys-2/cuda", "ort/cuda", "legacy-whisper"]

qwen-dml-win = ["ort/directml"]
qwen-vulkan  = ["dep:llama-cpp-sys-2", "llama-cpp-sys-2/vulkan"]
qwen-dml     = ["ort/directml"]
qwen-cuda    = ["dep:llama-cpp-sys-2", "llama-cpp-sys-2/cuda", "ort/cuda"]
qwen-cpu     = []
legacy-whisper = ["dep:whisper-rs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.dev]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true
codegen-units = 256
incremental = true

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false

[profile.release]
opt-level = 3           # 最佳优化速度
lto = "fat"             # 开启 Fat LTO 全局链接时内联与优化
codegen-units = 1       # 设为 1 以最大化 LTO 优化效果与无用代码裁剪
debug = 0               # 彻底关闭调试信息
panic = "abort"         # 移除堆栈展开表 (Unwind Table) 大幅裁剪体积
strip = true            # 自动剥离所有符号表 (Symbols)

