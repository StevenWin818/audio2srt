[package]
name = "rust_lib_audio2srt"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
cxx = "1.0"
mel_spec = "0.4.0"
hound = "3.5.1"
anyhow = "1.0"
zhconv = "0.4.1"
rubato = "0.15"
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", package = "deep_filter", default-features = false }
deepfilter-rt = { git = "https://github.com/shimondoodkin/deepfilter-rt" }
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["load-dynamic", "ndarray"] }
ndarray = "0.17"
ndarray_016 = { package = "ndarray", version = "0.16" }
flate2 = "1.0"
tar = "0.4"
crossbeam-channel = "0.5"
core_affinity = "0.8"
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading", "Win32_System_LibraryLoader"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
cxx-build = "1.0"
reqwest = { version = "0.11", features = ["blocking"] }
zip = "0.6"

[features]
default = []
cuda = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.dev]
debug-assertions = false

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
debug = 0
panic = "abort"
strip = true



